# Runs the whole test matrix on both PowerShell editions.
#
# The matrix is the point: every claim in this repository is verified twice,
# once on Windows PowerShell 5.1 and once on PowerShell 7. A green run on one
# edition says nothing about the other, which is exactly the failure mode the
# skill exists to prevent.
#
# The two editions get their own job instead of one job with a `shell` matrix
# axis. GitHub's validator rejects `shell: ${{ matrix.shell }}` with
# "Unrecognized named-value: 'matrix'": the `shell` key is resolved before the
# matrix expands, so it only accepts literals. Splitting the job is also what
# the module layout wants -- `Install-Module -Scope CurrentUser` from pwsh 7
# lands in Documents/PowerShell/Modules, which Windows PowerShell 5.1 never
# looks at, so each edition has to install its own Pester.
#
# A GitHub hosted runner is en-US (ANSI code page 1252, not 936). Everything
# that only makes sense on a CP936 host lives in tests/integration, where it
# skips itself, and is gated separately by cp936.yml on a self-hosted runner.

name: test

on:
  push:
    branches:
      - main
      - 'feature/**'
      # A fix branch gets the same matrix a feature branch does. Without this,
      # the only way to see a fix run is to open the pull request first, which
      # makes "push and look at the jobs" impossible while iterating.
      - 'fix/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  windows-powershell:
    name: Windows PowerShell 5.1 / py${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python:
          - '3.11'
          - '3.13'

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install test dependencies
        # Explicit, and separate from running the tests. tests/run-all.ps1 no
        # longer installs anything on its own, so a missing dependency fails
        # loudly with the command to run instead of quietly reaching the network.
        run: python -m pip install --disable-pip-version-check -r tests/requirements-test.txt

      - name: Install analysis modules
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # -SkipPublisherCheck: Pester 3.4.0 ships with Windows and is signed
          # differently, so the check rejects the 5.x package.
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Report the runner environment
        shell: powershell
        run: ./scripts/Get-WinScriptEnvironment.ps1

      - name: Run every suite
        shell: powershell
        run: ./tests/run-all.ps1

  pwsh:
    name: PowerShell 7 / py${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python:
          - '3.11'
          - '3.13'

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r tests/requirements-test.txt

      - name: Install analysis modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Report the runner environment
        shell: pwsh
        run: ./scripts/Get-WinScriptEnvironment.ps1

      - name: Run every suite
        shell: pwsh
        run: ./tests/run-all.ps1

  python-utf8-mode:
    # PEP 686 makes UTF-8 mode the default in Python 3.15: open() stops following
    # the ANSI code page. This repository's whole subject is "the default encoding
    # is not what you think", so the suite has to keep passing the day that
    # default moves. PYTHONUTF8=1 is the preview of that behaviour, not a 3.15
    # interpreter -- say so rather than implying real 3.15 coverage.
    name: Python UTF-8 mode (3.15 default preview)
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Executor suite with UTF-8 mode forced on
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: python -m unittest discover -s tests/python -v

      - name: Integration suite with UTF-8 mode forced on
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: python -m unittest discover -s tests/integration -v

  docs:
    name: docs contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependencies
        # tests/evals/test_workflows.py parses the workflow files. PyYAML is not
        # in the runner image, and a skipped parse is the same as no gate.
        run: python -m pip install --disable-pip-version-check -r tests/requirements-test.txt

      - name: Check SKILL.md size, routing and hygiene
        run: python -m unittest discover -s tests/evals -v
